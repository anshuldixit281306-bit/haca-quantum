services:
  - type: web
    name: quantumlearn-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: local
      - key: CORS_ORIGINS
        value: "https://macnquant.web.app,https://macnquant.firebaseapp.com,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: quantumlearn-db
          property: connectionString

databases:
  - name: quantumlearn-db
    databaseName: quantumlearn
    user: quantumlearn
    plan: free
