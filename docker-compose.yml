services:
  postgres:
    image: postgres:16-alpine
    container_name: quantumlearn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantumlearn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quantumlearn-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/quantumlearn
      - SECRET_KEY=production-secret-key-quantumlearn-change-me
      - AI_PROVIDER=local
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
